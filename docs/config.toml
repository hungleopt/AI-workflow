# The base URL of the site; the only required configuration variable.
base_url = "http://localhost"
port = 11421
nonce = "NONCE_PLACEHOLDER"
release_mode = false
has_html_extension = false

# Enable this to debugging on browserstack
# Run zola serve --base-url bs-local.com
# base_url_debug = "http://bs-local.com:11421"

# The site title and description; used in feeds by default.
title = "First Mile Internal Handbook"
description = "First Mile Internal Handbook"

# The default language; used in feeds.
default_language = "en"

# The site theme to use.
# theme = ""

# For overriding the default output directory `public`, set it to another value (e.g.: "docs")
output_dir = "public"

# When set to "true", the Sass files in the `sass` directory in the site root are compiled.
# Sass files in theme directories are always compiled.
compile_sass = true

# When set to "true", the generated HTML files are minified.
minify_html = false

# A list of glob patterns specifying asset files to ignore when the content
# directory is processed. Defaults to none, which means that all asset files are
# copied over to the `public` directory.
# Example:
#     ignored_content = ["*.{graphml,xlsx}", "temp.*", "**/build_folder"]
ignored_content = []

# When set to "true", a feed is automatically generated.
generate_feeds = false

# The number of articles to include in the feed. All items are included if
# this limit is not set (the default).
# feed_limit = 20

# When set to "true", files in the `static` directory are hard-linked. Useful for large
# static files. Note that for this to work, both `static` and the
# output directory need to be on the same filesystem. Note that the theme's `static`
# files are always copied, regardless of this setting.
hard_link_static = false

# The taxonomies to be rendered for the site and their configuration of the default languages
# Example:
#     taxonomies = [
#       {name = "tags", feed = true}, # each tag will have its own feed
#       {name = "tags"}, # you can have taxonomies with the same name in multiple languages
#       {name = "categories", paginate_by = 5},  # 5 items per page for a term
#       {name = "authors"}, # Basic definition: no feed or pagination
#     ]
#
taxonomies = []

meta = [
  { id = "auth-provider", name = "auth-provider", "content" = "aad" }
]

# theme_debugger = true

# When set to "true", a search index is built from the pages and section
# content for `default_language`.
build_search_index = false

# Syntax highlighting configuration (optional)
[markdown.highlighting]
# When set to "true", missing highlight languages are treated as errors. Defaults to false but recommended to set to true.
error_on_missing_language = false

# Whether to use inline hex colours (`inline`) or CSS classes (`class`) 
style = "class"

# If you use a single theme, put its name here. See the syntax highlighting  page for the possible choices.
# theme = "dark-plus"

# If you want light/dark themes, use the 2 fields below instead. See the syntax highlighting  page for the possible choices.
light_theme = "light-plus"                                                                                     
dark_theme = "dark-plus"

# A list of files for additional JSON TextMate grammars
# extra_grammars = [
#   "grammars/shellscript-patched.json"
# ]

# A list of files for additional JSON TextMate themes
extra_themes = []

# Configuration of the Markdown rendering
[markdown]
# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = false

# Whether external links are to be opened in a new tab
# If this is true, a `rel="noopener"` will always automatically be added for security reasons
external_links_target_blank = false

# Whether to set rel="nofollow" for all external links
external_links_no_follow = false

# Whether to set rel="noreferrer" for all external links
external_links_no_referrer = true

# Whether smart punctuation is enabled (changing quotes, dashes, dots in their typographic form)
# For example, `...` into `…`, `"quote"` into `“curly”` etc
smart_punctuation = false

# Configuration of the link checker.
[link_checker]
# Skip link checking for external URLs that start with these prefixes
# skip_prefixes = [
#     "http://[2001:db8::]/",
# ]

# Skip anchor checking for external URLs that start with these prefixes
# skip_anchor_prefixes = [
#     "https://caniuse.com/",
# ]

# Treat internal link problems as either "error" or "warn", default is "error"
internal_level = "error"

# Treat external link problems as either "error" or "warn", default is "error"
external_level = "error"

# Various slugification strategies, see below for details
# Defaults to everything being a slug
[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[search]
# Whether to include the title of the page/section in the index
include_title = true
# Whether to include the description of the page/section in the index
include_description = false
# Whether to include the path of the page/section in the index
include_path = false
# Whether to include the rendered content of the page/section in the index
include_content = true
# At which character to truncate the content to. Useful if you have a lot of pages and the index would
# become too big to load on the site. Defaults to not being set.
# truncate_content_length = 100

# Optional translation object for the default language
# Example:
#     default_language = "fr"
#
#     [translations]
#     title = "Un titre"
#
[translations]

# Additional languages definition
# You can define language specific config values and translations: 
# title, description, generate_feed, feed_filename, taxonomies, build_search_index
# as well as its own search configuration and translations (see above for details on those)
[languages]
# For example
# [languages.fr]
# title = "Mon blog"
# generate_feed = true
# taxonomies = [
#    {name = "auteurs"},
#    {name = "tags"},
# ]
# build_search_index = false

# You can put any kind of data here. The data
# will be accessible in all templates
# Example:
#     [extra]
#     author = "Famous author"
#
# author value will be available using {{ config.extra.author }} in templates
#
[extra]
# Put all your custom variables here
author = "First Mile"
author_name_home = "First Mile"
email = "vantuyen.pham@optimizely.com"
manifest = true
ga4_id = "" # Google Analytics code
gtm_id = "" # Google Analytics code
cloudflare_analytics_id = "" # Cloudflare Analytics ID
auth = false
auth_provider = "github"
enable_quicklink = true
hide_default_menu = true

# If running on netlify.app site, set to true
is_netlify = true

# Set HTML file language
language_code = "en-US"

# Set theme-color meta tag for Chrome browser
theme_color = "#fff"
theme_color_dark = "#181a1d"

# More about site's title
title_separator = "|"  # set as |, -, _, etc
title_addition = "Phạm Văn Tuyển"


# Set date format in blog publish metadata
timeformat = "%Y-%m-%d %H:%M:%S" # e.g. 2021-05-01 09:19:42
timezone = "UTC"

# Edit page on reposity or not
edit_page = false
docs_repo = "https://episerveremea-expertservices.visualstudio.com/First%20Mile/_git/FirstMile"
repo_branch = "main"

## Math settings
# options: true, false. Enable math support globally,
# default: false. You can always enable math on a per page.
math = false
library = "katex"  # options: "katex", "mathjax". default is "katex".

## Open Graph + Twitter Cards
[extra.open]
enable = true
# this image will be used as fallback if a page has no image of its own
image = "icons/preview.png"
twitter_site = "tuyen-at-work"
twitter_creator = "tuyen-at-work"
facebook_author = "tuyen.pham.2020"
facebook_publisher = "tuyen.pham.2020"
og_locale = "en_US"

## JSON-LD
[extra.schema]
type = "Organization"
logo = "icons/apple-touch-icon.png"
twitter = "https://twitter.com/tuyen_at_work"
linked_in = "https://www.linkedin.com/in/tuyen-at-work/"
github = "https://github.com/tuyen-at-work"
section = "blog" # see config.extra.main~url
## Sitelinks Search Box
site_links_search_box = false

[[extra.menu.main]]
name = "Guides"
section = "docs"
url = "#"

[[extra.menu.main.items]]
name = "Overview"
url = "/docs/overview/system-overview/"
section = "docs"

[[extra.menu.main.items]]
name = "Architect"
url = "/docs/architecture/application-bootstrap/"
section = "docs"

[[extra.menu.main.items]]
name = "Development"
url = "/docs/development/local-development/"
section = "docs"

[[extra.menu.main.items]]
name = "Backend"
url = "/docs/backend/feature-flows/"
section = "docs"

[[extra.menu.main.items]]
name = "Frontend"
url = "/docs/frontend/frontend-integration/"
section = "docs"

# Footer contents
[extra.footer]
info = 'Created by <a href="https://github.com/tuyen-at-work">Tuyen Pham</a>'
